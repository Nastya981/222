<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сервис рассылок</title>
</head>
<body>
    <nav>
        <a href="{% url 'mailing:home' %}">Главная</a>
        {% if request.user.is_authenticated %}
            <a href="{% url 'mailing:recipient_list' %}">Получатели</a>
            <a href="{% url 'mailing:message_list' %}">Сообщения</a>
            <a href="{% url 'mailing:mailing_list' %}">Рассылки</a>
            <form method="post"
                  action="{% url 'users:logout' %}"
                  style="display:inline">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'users:login' %}">Войти</a>
            <a href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
</body>
</html>
