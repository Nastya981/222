services:
  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - habit_network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - habit_network

  web:
    build: .
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - habit_network

  celery-worker:
    build: .
    restart: always
    command: celery -A config worker -l info -P solo
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - habit_network

  celery-beat:
    build: .
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - habit_network

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - habit_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  habit_network:
    driver: bridge